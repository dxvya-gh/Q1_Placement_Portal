apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: placement-app
  template:
    metadata:
      labels:
        app: placement-app
    spec:
      containers:
        - name: placement-app
          image: warmcoots/placement-app:v1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: placement-app-service
spec:
  type: NodePort
  selector:
    app: placement-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30013